services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novel_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novel_test_dev}
      POSTGRES_DB: ${POSTGRES_DB:-novel_test}
    ports:
      - "127.0.0.1:6542:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
